name: Rosbags Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rosbags_build_check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Figure assets (tex/joss/figs, evaluation figs) are LFS-tracked;
        # the example dataset is NOT (it is fetched from the GitHub release).
        lfs: true

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Build open-source targets
      run: |
        bazel build @example_data//:data_pipeline_processed__everything
        bazel build //processing_edges/rosbag_to_vision_dataset/src:everything
